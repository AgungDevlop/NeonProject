name: Deploy NeonCore UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract zip via Python
      run: |
        ZIP=$(ls *.zip 2>/dev/null | head -1)
        test -n "$ZIP" || { echo "No zip found"; exit 0; }
        echo "Extracting: $ZIP"
        python3 -c "
import zipfile, sys, os
z = zipfile.ZipFile(sys.argv[1], 'r')
files = z.namelist()
for f in files:
    # fix backslash paths from Windows zip
    dst = f.replace('\\', '/')
    os.makedirs(os.path.dirname(dst), exist_ok=True)
    with z.open(f) as src, open(dst, 'wb') as out:
        out.write(src.read())
    print('  ' + dst)
z.close()
print(f'Extracted {len(files)} files')
" "$ZIP"
        rm -f "$ZIP"
        echo "Extract done"

    - name: Commit and push
      run: |
        git config user.name "neon-deploy"
        git config user.email "deploy@neon.local"
        git add -A
        git diff --cached --quiet && echo "No changes" && exit 0
        git commit -m "Deploy NeonCore UI $(date +%Y-%m-%d)"
        git push
        echo "Done"
