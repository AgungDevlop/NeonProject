name: Deploy NeonCore UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Extract zip if present
      run: |
        ZIP=$(ls *.zip 2>/dev/null | head -1)
        if [ -z "$ZIP" ]; then
          echo "No zip file found"
          exit 0
        fi
        echo "Found: $ZIP"
        unzip -o "$ZIP" -d extracted
        cp -r extracted/* ./
        cp -r extracted/.[!.]* ./ 2>/dev/null || true
        rm -rf extracted "$ZIP"
        echo "Extract done"

    - name: Commit extracted files
      run: |
        git config user.name "neon-deploy"
        git config user.email "deploy@neon.local"
        git add -A
        CHANGED=$(git diff --cached --name-only)
        if [ -z "$CHANGED" ]; then
          echo "No changes to commit"
          exit 0
        fi
        echo "Changed: $CHANGED"
        git commit -m "Deploy NeonCore UI $(date +%Y-%m-%d)"
        git push
        echo "Push done"
