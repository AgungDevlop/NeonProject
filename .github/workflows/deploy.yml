name: Deploy NeonCore UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract zip
      run: |
        ZIP=$(ls *.zip 2>/dev/null | head -1)
        test -z "$ZIP" && echo "No zip" && exit 0
        echo "Extracting: $ZIP"
        unzip -qo "$ZIP"
        rm -f "$ZIP"
        echo "Done"

    - name: Commit and push
      run: |
        git config user.name "neon-deploy"
        git config user.email "deploy@neon.local"
        git add -A
        CHANGED=$(git diff --cached --name-only)
        test -z "$CHANGED" && echo "No changes" && exit 0
        echo "$CHANGED"
        git commit -m "Deploy NeonCore UI $(date +%Y-%m-%d)"
        git push
        echo "All done"
