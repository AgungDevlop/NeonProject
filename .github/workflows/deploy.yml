name: Deploy NeonCore UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract zip
      run: |
        ZIP=$(ls *.zip 2>/dev/null | head -1)
        test -n "$ZIP" || { echo "No zip"; exit 0; }
        echo "Found: $ZIP"
        unzip -o "$ZIP"
        rm -f "$ZIP"

    - name: Move files to root
      run: |
        if [ -d NeonCoreUI ]; then
          find NeonCoreUI -mindepth 1 -maxdepth 1 -exec mv {} ./ \;
          rmdir NeonCoreUI
        fi
        if [ -d extracted ]; then
          find extracted -mindepth 1 -maxdepth 1 -exec mv {} ./ \;
          rmdir extracted
        fi

    - name: Commit and push
      run: |
        git config user.name "neon-deploy"
        git config user.email "deploy@neon.local"
        git add -A
        git diff --cached --quiet && echo "No changes" && exit 0
        git commit -m "Deploy NeonCore UI $(date +%Y-%m-%d)"
        git push
        echo "Done"
